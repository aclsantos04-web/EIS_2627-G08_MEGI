<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - User List</title>

    <!-- Estilos comuns do projeto -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin-users.css">

</head>

<body>

<div class="app-layout">

    <!-- Sidebar -->
    <nav class="sidebar" aria-label="Admin menu">

        <a href="index.html"
           class="sidebar-logo"
           aria-label="CMS – go to homepage">

            <svg viewBox="0 0 64 40" aria-hidden="true">
                <rect x="2" y="4" width="34" height="24"
                      fill="currentColor"/>

                <path d="M38 12h12l10 10v6H38z"
                      fill="currentColor"/>

                <circle cx="14" cy="32" r="5"
                        fill="#fff"
                        stroke="currentColor"
                        stroke-width="3"/>

                <circle cx="48" cy="32" r="5"
                        fill="#fff"
                        stroke="currentColor"
                        stroke-width="3"/>
            </svg>

            CMS
        </a>

        <div class="sidebar-role">
            <span class="role-icon" aria-hidden="true">💼</span>
            Admin Panel
        </div>

        <a href="admin-staff.html">
            <i class="ti ti-user-check" aria-hidden="true"></i>
            Staff Approvals
        </a>

        <a href="admin-users.html" class="active">
            <i class="ti ti-users" aria-hidden="true"></i>
            Users
        </a>

        <a href="admin_dashboard.html">
            <i class="ti ti-layout-dashboard" aria-hidden="true"></i>
            Dashboard
        </a>

        <a href="admin_profile.html">
            <i class="ti ti-user" aria-hidden="true"></i>
            Profile
        </a>

        <a href="login.html" class="logout">
            <i class="ti ti-logout" aria-hidden="true"></i>
            Log out
        </a>

    </nav>


    <!-- Conteúdo principal -->
    <main class="app-content">

        <div class="page-header">
            <div>
                <h1>User List</h1>
                <p class="text-muted">
                    View and manage registered CMS users.
                </p>
            </div>
        </div>


        <!-- Lista de utilizadores -->
        <section class="card users-card">

            <div class="users-card-header">

                <div>
                    <h2>Registered Users</h2>

                    <p class="text-muted">
                        Select a user to view or edit their account information.
                    </p>
                </div>

                <div class="user-tools">

                    <input
                        type="search"
                        id="userSearch"
                        placeholder="Search users...">

                    <select id="typeFilter">
                        <option value="all">All types</option>
                        <option value="client">Client</option>
                        <option value="courier">Courier</option>
                        <option value="staff">Staff</option>
                        <option value="admin">Admin</option>
                    </select>

                </div>

            </div>


            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Registration Date</th>
                            <th>Type</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="usersTable"></tbody>
                </table>
            </div>
        </section>
    </main>

</div>

<!-- Shared data -->
<script src="js/accounts.js"></script>

<!-- User list logic -->
<script src="js/admin-users.js"></script>

<!-- Topbar comum das páginas Admin -->
<script
    src="js/topbar.js"
    data-name="Carlos Pinto"
    data-role="Admin"
    data-username="admin"
    data-profile="admin_profile.html">
</script>

</body>
</html>
