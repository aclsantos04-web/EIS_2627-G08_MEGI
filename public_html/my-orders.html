
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CMS - My Orders</title>

  
<link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cms-lara.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet">
    <!-- Who is logged in: accounts.js (users) + session.js (the logged-in user).
         Loaded first, so every script on this page can use them. -->
    <script src="js/accounts.js"></script>
    <script src="js/session.js"></script>
</head>

<body>

    <div class="app-layout">

        <!-- ===== SIDEBAR (the same on every Client page) =====
             class="active" marks the page you are on. -->
        <nav class="sidebar" aria-label="Client menu">
            <a href="index.html" class="sidebar-logo" aria-label="CMS – go to homepage">
                <svg viewBox="0 0 64 40" aria-hidden="true">
                    <rect x="2" y="4" width="34" height="24" fill="currentColor"/>
                    <path d="M38 12h12l10 10v6H38z" fill="currentColor"/>
                    <circle cx="14" cy="32" r="5" fill="#fff" stroke="currentColor" stroke-width="3"/>
                    <circle cx="48" cy="32" r="5" fill="#fff" stroke="currentColor" stroke-width="3"/>
                </svg>
                CMS
            </a>
            <div class="sidebar-role"><span class="role-icon" aria-hidden="true">📦</span> Client Panel</div>
            <a href="client_new_order.html"><i class="ti ti-square-plus" aria-hidden="true"></i> New Order</a>
            <a href="my-orders.html" class="active"><i class="ti ti-list-details" aria-hidden="true"></i> My Orders</a>
            <a href="new-product.html"><i class="ti ti-box" aria-hidden="true"></i> New Product</a>
            <a href="my-products.html"><i class="ti ti-packages" aria-hidden="true"></i> My Products</a>
            <a href="client_profile.html"><i class="ti ti-user" aria-hidden="true"></i> Profile</a>
            <a href="login.html" class="logout"><i class="ti ti-logout" aria-hidden="true"></i> Log out</a>
        </nav>

        <!-- MAIN CONTENT -->

        <main class="app-content orders-content">

            <h1>My Orders</h1>

            <!-- "View" is a link to the details page. ?order=1001 tells that
                 page which order to show (read by js/client_orders.js). -->

            <!-- table-wrap = the shared table card from style.css -->
            <div class="table-wrap orders-table-container">

                <table class="orders-table">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Origin</th>
                            <th>Destination</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="orderRows">
                        <!-- Filled by js/my-orders.js from js/orders.js, so the
                             status changes when a courier accepts or delivers an order. -->
                    </tbody>

                </table>

            </div>

        </main>

    </div>

<!-- Top bar (notifications + user menu), built by js/topbar.js -->
<script src="js/orders.js"></script>
<script src="js/my-orders.js"></script>

<script src="js/topbar.js"
        data-name="Marta Ferreira"
        data-role="Client"
        data-username="marta.ferreira"
        data-profile="client_profile.html"></script>
</body>
</html>
