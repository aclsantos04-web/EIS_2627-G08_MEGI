
<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet">

</head>

<body>

        <!-- ===== SIDEBAR (the same on every Client page) =====
             class="active" marks the page you are on. -->
        <nav class="sidebar" aria-label="Client menu">
            <a href="index.html" class="sidebar-logo" aria-label="CMS – go to homepage">
                <svg viewBox="0 0 64 40" aria-hidden="true">
                    <rect x="2" y="4" width="34" height="24" fill="currentColor"/>
                    <path d="M38 12h12l10 10v6H38z" fill="currentColor"/>

                    <circle cx="48" cy="32" r="5" fill="#fff" stroke="currentColor" stroke-width="3"/>
                </svg>
                CMS
            </a>
            <div class="sidebar-role"><span class="role-icon" aria-hidden="true">📦</span> Client Panel</div>
            <a href="client_new_order.html"><i class="ti ti-square-plus" aria-hidden="true"></i> New Order</a>
            <a href="my-orders.html"><i class="ti ti-list-details" aria-hidden="true"></i> My Orders</a>

        </nav>

        <!-- MAIN CONTENT -->

        <main class="app-content product-content">

            <h1>Create New Product</h1>

            <section class="product-container">

                <h2>Product Information</h2>

                <form id="product-form" novalidate="">

                    <div class="product-fields">

                        <!-- PRODUCT NAME -->

                        <div class="product-group">

                            <label for="product-name">
                                Product Name
                            </label>

                            <input type="text"
                                   id="product-name"
                                   name="product-name"
                                   placeholder="e.g.: Product A"
                                   required>

                        </div>

                        <!-- PRODUCT DESCRIPTION -->

                        <div class="product-group">

                            <label for="product-description">
                                Product Description
                            </label>

                            <input type="text"
                                   id="product-description"
                                   name="product-description"
                                   placeholder="e.g.: Smartphone"
                                   required>

                        </div>

                        <!-- PRODUCT CATEGORY -->

                        <div class="product-group">

                            <label for="product-category">
                                Product Category
                            </label>

                            <input type="text"
                                   id="product-category"
                                   name="product-category"
                                   placeholder="e.g.: Electronics"
                                   required>

                        </div>

                    </div>

                    <!-- PRODUCT SIZING -->

                    <h2 class="sizing-title">
                        Product Sizing
                    </h2>

                    <div class="product-sizing">

                        <!-- WEIGHT -->

                        <div class="product-group">

                            <label for="product-weight">
                                Weight (kg)
                            </label>

                            <input type="number"
                                   id="product-weight"
                                   name="weight"
                                   placeholder="0.00"
                                   min="0.01"
                                   step="0.01"
                                   required>

                        </div>

                        <!-- VOLUME -->

                        <div class="product-group">

                            <label for="product-volume">
                                Volume (m³)
                            </label>

                            <input type="number"
                                   id="product-volume"
                                   name="volume"
                                   placeholder="0.00"
                                   min="0.001"
                                   step="0.001"
                                   required>

                        </div>

                    </div>

                    <!-- SUBMIT BUTTON -->

                    <div id="product-message" role="status"></div>

<button type="submit" class="product-button">
    Submit Product
</button>

                </form>

            </section>

        </main>

    </div>
<script src="js/new-product.js"></script>

</body>
