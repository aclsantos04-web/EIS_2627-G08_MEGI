<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Staff Panel | Vehicle Approvals</title>
    <!-- Estilos globais da equipa -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Estilos complementares de Staff -->
    <link rel="stylesheet" href="css/staff.css">
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar oficial do projeto -->
        <!-- ===== SIDEBAR (the same on every Staff page) =====
             class="active" marks the page you are on. -->
        <nav class="sidebar" aria-label="Staff menu">
            <a href="index.html" class="sidebar-logo" aria-label="CMS – go to homepage">
                <svg viewBox="0 0 64 40" aria-hidden="true">
                    <rect x="2" y="4" width="34" height="24" fill="currentColor"/>
                    <path d="M38 12h12l10 10v6H38z" fill="currentColor"/>
                    <circle cx="14" cy="32" r="5" fill="#fff" stroke="currentColor" stroke-width="3"/>
                    <circle cx="48" cy="32" r="5" fill="#fff" stroke="currentColor" stroke-width="3"/>
                </svg>
                CMS
            </a>
            <div class="sidebar-role"><span class="role-icon" aria-hidden="true">📋</span> Staff Panel</div>
            <a href="staff_courier_approvals.html"><i class="ti ti-user-check" aria-hidden="true"></i> Courier Approvals</a>
            <a href="staff_vehicle_approvals.html" class="active"><i class="ti ti-truck" aria-hidden="true"></i> Vehicle Approvals</a>
            <a href="staff_alerts.html"><i class="ti ti-alert-triangle" aria-hidden="true"></i> Document Alerts</a>
            <a href="staff_profile.html"><i class="ti ti-user" aria-hidden="true"></i> Profile</a>
            <a href="login.html" class="logout"><i class="ti ti-logout" aria-hidden="true"></i> Log out</a>
        </nav>

        <!-- Área Principal de Conteúdo -->
        <main class="app-content">
            <header class="page-header">
                <h1>Vehicle Approvals</h1>
            </header>
            <p class="text-muted page-intro">A vehicle can only be used for orders after Staff approve it. Expired documents are shown in red.</p>

            <!-- Confirmation after Approve / Reject (js/staff_vehicles.js) -->
            <div class="alert alert-success staff-feedback" id="staffFeedback" role="status" hidden></div>

            <!-- Tabela com a classe padrão .table-wrap do style.css -->
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>License Plate</th>
                            <th>Courier</th>
                            <th>Vehicle Type</th>
                            <th>Insurance Expiry</th>
                            <th>Inspection Expiry</th>
                            <th class="actions-header">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="vehicleTableBody">
                        <!-- Filled by js/staff_vehicles.js from js/vehicles.js
                             (getFleet): every vehicle still waiting for approval. -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/vehicles.js"></script>
    <script src="js/staff_vehicles.js"></script>
<!-- Top bar (notifications + user menu), built by js/topbar.js -->
<!-- Shared data, so the top bar counts match the pages -->
<script src="js/accounts.js"></script>
<script src="js/topbar.js"
        data-name="Rita Almeida"
        data-role="Staff"
        data-username="rita.almeida"
        data-profile="staff_profile.html"></script>
</body>
</html>
