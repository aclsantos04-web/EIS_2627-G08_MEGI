
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CMS - Login</title>

   
<link rel="stylesheet" href="css/cms-lara.css">
<link rel="stylesheet" href="css/public-header.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet">
</head>

<body>

    
<header class="public-header">

    <a href="cms-home.html" class="public-logo"
       aria-label="CMS - Homepage">
        <svg viewBox="0 0 64 40" aria-hidden="true">
            <rect x="2" y="4" width="34" height="24"
                  fill="currentColor"/>
            <path d="M38 12h12l10 10v6H38z"
                  fill="currentColor"/>
            <circle cx="14" cy="32" r="5"
                    fill="#fff" stroke="currentColor"
                    stroke-width="3"/>
            <circle cx="48" cy="32" r="5"
                    fill="#fff" stroke="currentColor"
                    stroke-width="3"/>
        </svg>
        CMS
    </a>

    <nav class="public-nav" aria-label="Main menu">
        <a href="cms-home.html">Home</a>
        <a href="team.html">Meet the Team</a>
    </nav>

    <div class="public-actions">
        <a href="login.html"
           class="public-btn public-btn-primary">
            Login
        </a>

        <a href="register.html"
           class="public-btn public-btn-outline">
            Get Started
        </a>
    </div>

</header>


    <main class="login-page">

        <section class="login-container">

            <h1>Welcome Back!</h1>

            <form id="login-form" novalidate=>

                <label for="username">Email or username</label>
                <input type="text" id="username"
                       name="username"
                       placeholder="name@example.com"
                       autocomplete="username"
                       required>
                
                <small id="username-error" class="field-error"></small>

                <label for="password">Password</label>
                <input type="password" id="password"
                       name="password"
                       placeholder="Enter your password"
                       autocomplete="current-password"
                       required>
                <small id="password-error" class="field-error"></small>

                <p>Forgot password?</p>
                <div id="login-message" role="alert"></div>

                <button type="submit">Login</button>

            </form>

        </section>

    </main>
<script src="js/login.js"></script>
</body>
</html>
