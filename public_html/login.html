
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CMS - Login</title>

   
<link rel="stylesheet" href="css/cms-lara.css">
<link rel="stylesheet" href="css/public-header.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet">
</head>

<body>

    
<header class="public-header">

    <a href="cms-home.html" class="public-logo"
       aria-label="CMS - Homepage">
        <svg viewBox="0 0 64 40" aria-hidden="true">
            <rect x="2" y="4" width="34" height="24"
                  fill="currentColor"/>
            <path d="M38 12h12l10 10v6H38z"
                  fill="currentColor"/>
            <circle cx="14" cy="32" r="5"
                    fill="#fff" stroke="currentColor"
                    stroke-width="3"/>
            <circle cx="48" cy="32" r="5"
                    fill="#fff" stroke="currentColor"
                    stroke-width="3"/>
        </svg>
        CMS
    </a>

    <nav class="public-nav" aria-label="Main menu">
        <a href="cms-home.html">Home</a>
        <a href="team.html">Meet the Team</a>
    </nav>

    <div class="public-actions">
        <a href="login.html"
           class="public-btn public-btn-primary">
            Login
        </a>

        <a href="register.html"
           class="public-btn public-btn-outline">
            Get Started
        </a>
    </div>

</header>


    <main class="login-page">

        <section class="login-container">

            <h1>Welcome Back!</h1>

            <form id="login-form" novalidate=>

                <label for="username">Email or username</label>
                <input type="text" id="username"
                       name="username"
                       placeholder="name@example.com"
                       autocomplete="username"
                       required>
                
                <small id="username-error" class="field-error"></small>

                <label for="password">Password</label>
                <input type="password" id="password"
                       name="password"
                       placeholder="Enter your password"
                       autocomplete="current-password"
                       required>
                <small id="password-error" class="field-error"></small>

                
<!-- FORGOT PASSWORD -->


<button type="button" id="forgot-open" class="forgot-link">
    Forgot your password?
</button>



                <div id="login-message" role="alert"></div>

                <button type="submit">Login</button>

            </form>

        </section>

    </main>
<script src="js/login.js"></script>

<!-- PASSWORD RESET POPUP -->

<style>
.forgot-link {
    display: block;
    margin: 2px 0 18px auto;
    padding: 0;
    width: fit-content;
    background: none !important;
    border: none !important;
    box-shadow: none !important;
    color: #215394 !important;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
}

.forgot-link:hover {
    text-decoration: underline;
    transform: none !important;
}

.reset-popup {
    width: min(440px, calc(100% - 32px));
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    margin: auto;
    padding: 32px;
    border: 1px solid #dae7f2;
    border-radius: 20px;
    background: white;
    color: #192e47;
    box-shadow: 0 25px 70px rgba(10,35,70,0.2);
    font-family: 'Inter', Arial, sans-serif;
}

.reset-popup::backdrop {
    background: rgba(15, 35, 65, 0.55);
    backdrop-filter: blur(3px);
}

.reset-popup-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.reset-popup-icon {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: 13px;
    background: #e7f1fa;
    color: #215394;
    font-size: 24px;
}

.reset-close {
    background: transparent;
    color: #60758a;
    border: none;
    font-size: 24px;
    cursor: pointer;
}

.reset-popup h2 {
    margin: 21px 0 10px;
    color: #173e70;
    font-size: 24px;
}

.reset-popup p {
    color: #61758a;
    font-size: 13px;
    line-height: 1.7;
}

.reset-popup label {
    display: block;
    margin: 22px 0 8px;
    font-size: 13px;
    font-weight: 700;
}

.reset-popup input {
    box-sizing: border-box;
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border: 1px solid #cbdbea;
    border-radius: 10px;
    outline: none;
    font-size: 14px;
}

.reset-popup input:focus {
    border-color: #215394;
    box-shadow: 0 0 0 3px #21539418;
}

.reset-submit {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #215394;
    color: white;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

.reset-submit:hover {
    background: #173e70;
}

.reset-feedback {
    margin-top: 15px;
    padding: 12px;
    border-radius: 9px;
    background: #e7f5ed;
    color: #236345;
    font-size: 12px;
    line-height: 1.6;
}

.reset-feedback[hidden] {
    display: none;
}
</style>

<dialog id="reset-popup" class="reset-popup"
        aria-labelledby="reset-title">

    <div class="reset-popup-header">
        <div class="reset-popup-icon">🔒</div>

        <button type="button" class="reset-close"
                id="reset-close" aria-label="Close">
            &times;
        </button>
    </div>

    <h2 id="reset-title">Reset your password</h2>

    <p>
        Forgot your password? Enter your email address
        below to request a password reset.
    </p>

    <label for="reset-email">Email address</label>

    <input type="email" id="reset-email"
           placeholder="name@example.com"
           autocomplete="email" required>

    <button type="button" class="reset-submit"
            id="reset-submit">
        Request Reset Link
    </button>

    <div id="reset-feedback" class="reset-feedback"
         role="status" aria-live="polite" hidden>
    </div>

</dialog>

<script>
(function () {
    const popup = document.getElementById("reset-popup");
    const openButton = document.getElementById("forgot-open");
    const closeButton = document.getElementById("reset-close");
    const submitButton = document.getElementById("reset-submit");
    const email = document.getElementById("reset-email");
    const feedback = document.getElementById("reset-feedback");

    openButton.addEventListener("click", function () {
        email.value = "";
        feedback.hidden = true;
        feedback.textContent = "";
        popup.showModal();
    });

    closeButton.addEventListener("click", function () {
        popup.close();
    });

    popup.addEventListener("click", function (event) {
        if (event.target === popup) {
            popup.close();
        }
    });

    submitButton.addEventListener("click", function () {
        if (!email.value.trim() || !email.checkValidity()) {
            feedback.hidden = false;
            feedback.style.background = "#fff0ee";
            feedback.style.color = "#a3342b";
            feedback.textContent =
                "Please enter a valid email address.";
            return;
        }

        feedback.hidden = false;
        feedback.style.background = "#e7f5ed";
        feedback.style.color = "#236345";
        feedback.textContent =
            "Email validated successfully! This is a demo. " +
            "No password reset email has been sent.";
    });
})();
</script>

</body>
</html>
