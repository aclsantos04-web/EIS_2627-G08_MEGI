<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Create New Order</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Tabler Icons (para os ícones da sidebar da equipa) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <!-- CSS Partilhado do Grupo -->
    <link rel="stylesheet" href="css/style.css">
    <!-- CSS Complementar do Cliente -->
    <link rel="stylesheet" href="css/client.css">
</head>
<body>

    <div class="app-layout">
        <!-- ===== SIDEBAR (the same on every Client page) ===== -->
        <nav class="sidebar" aria-label="Client menu">
            <a href="index.html" class="sidebar-logo" aria-label="CMS – go to homepage">
                <svg viewBox="0 0 64 40" aria-hidden="true">
                    <rect x="2" y="4" width="34" height="24" fill="currentColor"/>
                    <path d="M38 12h12l10 10v6H38z" fill="currentColor"/>
                    <circle cx="14" cy="32" r="5" fill="#fff" stroke="currentColor" stroke-width="3"/>
                    <circle cx="48" cy="32" r="5" fill="#fff" stroke="currentColor" stroke-width="3"/>
                </svg>
                CMS
            </a>
            <div class="sidebar-role"><span class="role-icon" aria-hidden="true">📦</span> Client Panel</div>
            <a href="client_new_order.html" class="active"><i class="ti ti-square-plus" aria-hidden="true"></i> New Order</a>
            <a href="my-orders.html"><i class="ti ti-list-details" aria-hidden="true"></i> My Orders</a>
            <a href="new-product.html"><i class="ti ti-box" aria-hidden="true"></i> New Product</a>
            <a href="my-products.html"><i class="ti ti-packages" aria-hidden="true"></i> My Products</a>
            <a href="client_profile.html"><i class="ti ti-user" aria-hidden="true"></i> Profile</a>
            <a href="login.html" class="logout"><i class="ti ti-logout" aria-hidden="true"></i> Log out</a>
        </nav>

        <!-- Área Principal -->
        <main class="app-content">
            <header class="page-header">
                <h1>Create new order</h1>
            </header>

            <form id="orderForm" class="order-grid" novalidate>
                
                <!-- Package Information -->
                <section class="card package-card">
                    <h3>Package Information</h3>
                    
                    <div class="product-input-row">
                        <select id="productSelect">
                            <option value="" disabled selected>Select Products</option>
                            <option value="Product A" data-weight="5kg" data-vol="0.02 m²">Product A (5kg | 0.02 m²)</option>
                            <option value="Product B" data-weight="12kg" data-vol="0.05 m²">Product B (12kg | 0.05 m²)</option>
                            <option value="Product C" data-weight="1.5kg" data-vol="0.005 m²">Product C (1.5kg | 0.005 m²)</option>
                        </select>

                        <input type="number" id="productQty" class="qty-input" placeholder="Qt" min="1" value="1">
                        
                        <button type="button" id="btnAddProduct" class="btn btn-secondary btn-small">Add</button>
                    </div>

                    <!-- Lista de produtos adicionados -->
                    <div id="selectedProductsList" class="product-list"></div>
                </section>

                <!-- Additional Information -->
                <section class="card notes-card">
                    <h3>Additional Information</h3>
                    <textarea id="orderNotes" placeholder="Notes (optional)"></textarea>
                </section>

                <!-- Select Location -->
                <section class="card location-card">
                    <div class="location-header-row">
                        <h3>Select Location</h3>
                        <!-- Seletor de qual ponto o clique no mapa vai definir -->
                        <div class="map-target-switch" role="group" aria-label="Map click target">
                            <button type="button" id="targetOriginBtn" class="target-pill active-origin">
                                <span class="dot dot-green"></span> Set Origin
                            </button>
                            <button type="button" id="targetDestBtn" class="target-pill">
                                <span class="dot dot-red"></span> Set Destination
                            </button>
                        </div>
                    </div>
                    
                    <!-- ORIGIN -->
                    <div class="coords-section">
                        <div class="coords-subtitle">Origin</div>
                        <div class="address-search-row">
                            <input type="text" id="originAddress" placeholder="Search origin address (e.g. FEUP, Porto)" autocomplete="off">
                            <button type="button" id="btnSearchOrigin" class="btn btn-secondary btn-small" title="Search address">Search</button>
                        </div>
                        <div id="originSuggestions" class="suggestions-list"></div>

                        <div class="coords-row">
                            <div class="input-block">
                                <label for="originLat">Latitude</label>
                                <input type="number" step="any" id="originLat" placeholder="41.1780" value="41.1780">
                            </div>
                            <div class="input-block">
                                <label for="originLong">Longitude</label>
                                <input type="number" step="any" id="originLong" placeholder="-8.5980" value="-8.5980">
                            </div>
                        </div>
                    </div>

                    <!-- DESTINATION -->
                    <div class="coords-section">
                        <div class="coords-subtitle">Destination</div>
                        <div class="address-search-row">
                            <input type="text" id="destAddress" placeholder="Search destination address (e.g. Aliados, Porto)" autocomplete="off">
                            <button type="button" id="btnSearchDest" class="btn btn-secondary btn-small" title="Search address">Search</button>
                        </div>
                        <div id="destSuggestions" class="suggestions-list"></div>

                        <div class="coords-row">
                            <div class="input-block">
                                <label for="destLat">Latitude</label>
                                <input type="number" step="any" id="destLat" placeholder="41.1496" value="41.1496">
                            </div>
                            <div class="input-block">
                                <label for="destLong">Longitude</label>
                                <input type="number" step="any" id="destLong" placeholder="-8.6109" value="-8.6109">
                            </div>
                        </div>
                    </div>

                    <div class="action-footer">
                        <button type="submit" class="btn btn-primary">Submit Order</button>
                    </div>
                </section>

                <!-- Contentor do Mapa -->
                <section class="card map-container-card">
                    <div class="map-wrapper">
                        <div id="map"></div>
                        <!-- Legenda visual -->
                        <div class="map-legend-box">
                            <div class="legend-item"><span class="dot dot-green"></span> Origin</div>
                            <div class="legend-item"><span class="dot dot-red"></span> Destination</div>
                            <div class="legend-item"><span class="route-line-sample"></span> Route</div>
                        </div>
                    </div>
                    <div class="map-footer-hint">
                        <p class="text-muted" id="mapHintText">Click on the map to set <strong>Origin</strong>, search an address, or edit coordinates</p>
                    </div>
                </section>

            </form>
        </main>
    </div>

    <!-- Scripts na ordem correta -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map.js"></script>
    <script src="js/client_order.js"></script>
    <script src="js/topbar.js"
            data-name="Marta Ferreira"
            data-role="Client"
            data-username="marta.ferreira"
            data-profile="client_profile.html"></script>
</body>
</html>
