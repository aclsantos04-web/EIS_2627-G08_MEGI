<!DOCTYPE html>
<html lang="en">

    <head>
        <title>CMS - Available Orders</title>

        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <!-- CSS comum do projeto -->
        <link rel="stylesheet" href="css/style.css">
    </head>


    <body>

        <div class="app-layout">


            <!-- =========================================
                 SIDEBAR
                 ========================================= -->

            <aside class="sidebar">

                <!-- Logo -->
                <a href="index.html" class="sidebar-logo">
                    CMS
                </a>


                <!-- Tipo de utilizador -->
                <div class="sidebar-role">
                    🚚 Courier
                </div>


                <!-- Navegação Courier -->

                <a href="courier-available-orders.html"
                   class="active">
                    Available Orders
                </a>

                <a href="courier-active-route.html">
                    Active Route
                </a>

                <a href="courier-proof-delivery.html">
                    Proof of Delivery
                </a>

                <a href="courier-vehicles.html">
                    Vehicles
                </a>

                <a href="courier-completed-orders.html">
                    Completed Orders
                </a>

                <a href="courier_profile.html">
                    Profile
                </a>
                
            </aside>



            <!-- =========================================
                 CONTEÚDO PRINCIPAL
                 ========================================= -->

            <main class="app-content">


                <div class="page-header">

                    <h1>Available Orders</h1>

                </div>



                <!-- =====================================
                     ORDERS DISPONÍVEIS
                     ===================================== -->

                <div class="card-grid">


                    <!-- ORDER 1001 -->

                    <div class="card">

                        <h2>Order #1001</h2>

                        <h3>Porto → Aveiro</h3>

                        <p>
                            Distance: 70 km
                        </p>

                        <p class="text-muted">
                            2 packages · 8 kg
                        </p>


                        <button
                            type="button"
                            class="btn btn-outline btn-small select-order-btn"
                            data-order="1001">

                            Select Order

                        </button>


                        <a
                            href="courier-active-route.html?order=1001"
                            class="btn btn-secondary btn-small">

                            View Details

                        </a>

                    </div>



                    <!-- ORDER 1002 -->

                    <div class="card">

                        <h2>Order #1002</h2>

                        <h3>Aveiro → Coimbra</h3>

                        <p>
                            Distance: 70 km
                        </p>

                        <p class="text-muted">
                            2 packages · 8 kg
                        </p>


                        <button
                            type="button"
                            class="btn btn-outline btn-small select-order-btn"
                            data-order="1002">

                            Select Order

                        </button>


                        <a
                            href="courier-active-route.html?order=1002"
                            class="btn btn-secondary btn-small">

                            View Details

                        </a>

                    </div>

                </div>



                <!-- =====================================
                     CONFIRMAR SELEÇÃO
                     ===================================== -->

                <button
                    type="button"
                    id="acceptSelection"
                    class="btn btn-primary">

                    Accept Selection

                </button>


                <!-- Mensagem de erro -->
                <span
                    id="selectionError"
                    class="error-message">
                </span>


            </main>

        </div>



        <!-- =============================================
             JAVASCRIPT
             ============================================= -->

        <script>

            /*
             * Guarda o ID da order selecionada.
             * Inicialmente nenhuma order está selecionada.
             */
            let selectedOrder = null;


            /*
             * Procurar todos os botões "Select Order".
             */
            const orderButtons =
                    document.querySelectorAll(".select-order-btn");


            /*
             * Para cada botão, adicionar o comportamento
             * de seleção da respetiva order.
             */
            orderButtons.forEach(function (button) {

                button.addEventListener("click", function () {


                    /*
                     * Retirar o destaque de todos
                     * os outros botões.
                     */
                    orderButtons.forEach(function (otherButton) {

                        otherButton.classList.remove("btn-secondary");

                        otherButton.classList.add("btn-outline");

                        otherButton.textContent = "Select Order";

                    });


                    /*
                     * Guardar o número da order selecionada.
                     */
                    selectedOrder =
                            button.getAttribute("data-order");


                    /*
                     * Destacar visualmente o botão selecionado.
                     */
                    button.classList.remove("btn-outline");

                    button.classList.add("btn-secondary");

                    button.textContent = "Selected";


                    /*
                     * Limpar eventual mensagem de erro.
                     */
                    document.getElementById("selectionError")
                            .textContent = "";

                });

            });



            /*
             * Botão Accept Selection.
             */
            document.getElementById("acceptSelection")
                    .addEventListener("click", function () {


                        /*
                         * Se nenhuma order tiver sido selecionada,
                         * mostrar mensagem de erro.
                         */
                        if (selectedOrder === null) {

                            document.getElementById("selectionError")
                                    .textContent =
                                    "Please select an order first.";

                            return;
                        }


                        /*
                         * Depois de aceitar a order,
                         * abrir a página Active Route.
                         *
                         * O número da order é enviado através do URL.
                         */
                        window.location.href =
                                "courier-active-route.html?order="
                                + selectedOrder;

                    });

        </script>

    </body>

</html>
