<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Available Orders</title>

    <!-- CSS comum do projeto -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-layout">

        <!-- Menu lateral -->
        <!-- ===== SIDEBAR (the same on every Courier page) =====
             class="active" marks the page you are on. -->
        <nav class="sidebar" aria-label="Courier menu">
            <a href="index.html" class="sidebar-logo" aria-label="CMS – go to homepage">
                <svg viewBox="0 0 64 40" aria-hidden="true">
                    <rect x="2" y="4" width="34" height="24" fill="currentColor"/>
                    <path d="M38 12h12l10 10v6H38z" fill="currentColor"/>
                    <circle cx="14" cy="32" r="5" fill="#fff" stroke="currentColor" stroke-width="3"/>
                    <circle cx="48" cy="32" r="5" fill="#fff" stroke="currentColor" stroke-width="3"/>
                </svg>
                CMS
            </a>
            <div class="sidebar-role"><span class="role-icon" aria-hidden="true">🚚</span> Courier Panel</div>
            <a href="courier-available-orders.html" class="active"><i class="ti ti-package" aria-hidden="true"></i> Available Orders</a>
            <a href="courier-active-route.html"><i class="ti ti-route" aria-hidden="true"></i> Active Route</a>
            <a href="courier-proof-delivery.html"><i class="ti ti-signature" aria-hidden="true"></i> Proof of Delivery</a>
            <a href="courier-vehicles.html"><i class="ti ti-truck" aria-hidden="true"></i> Vehicles</a>
            <a href="courier-completed-orders.html"><i class="ti ti-circle-check" aria-hidden="true"></i> Completed Orders</a>
            <a href="courier_profile.html"><i class="ti ti-user" aria-hidden="true"></i> Profile</a>
            <a href="login.html" class="logout"><i class="ti ti-logout" aria-hidden="true"></i> Log out</a>
        </nav>

        <!-- Conteúdo principal -->
        <main class="app-content">
            <div class="page-header">
                <h1>Available Orders</h1>
            </div>

            <!-- Orders disponíveis -->
            <div class="card-grid">

                <!-- Order 1001 -->
                <div class="card">
                    <h2>Order #1001</h2>
                    <h3>Porto → Aveiro</h3>

                    <p>Distance: 70 km</p>

                    <p class="text-muted">
                        2 packages · 8 kg
                    </p>

                    <button
                        type="button"
                        class="btn btn-outline btn-small select-order-btn"
                        data-order="1001">
                        Select Order
                    </button>

                    <a
                        href="courier-active-route.html?order=1001"
                        class="btn btn-secondary btn-small">
                        View Details
                    </a>
                </div>

                <!-- Order 1002 -->
                <div class="card">
                    <h2>Order #1002</h2>
                    <h3>Aveiro → Coimbra</h3>

                    <p>Distance: 70 km</p>

                    <p class="text-muted">
                        2 packages · 8 kg
                    </p>

                    <button
                        type="button"
                        class="btn btn-outline btn-small select-order-btn"
                        data-order="1002">
                        Select Order
                    </button>

                    <a
                        href="courier-active-route.html?order=1002"
                        class="btn btn-secondary btn-small">
                        View Details
                    </a>
                </div>
            </div>

            <!-- Confirmar seleção -->
            <button
                type="button"
                id="acceptSelection"
                class="btn btn-primary">
                Accept Selection
            </button>

            <!-- Mensagem de erro -->
            <span
                id="selectionError"
                class="error-message">
            </span>
        </main>
    </div>

    <!-- JavaScript desta página -->
    <script>
        /* Guarda a order selecionada */
        let selectedOrder = null;

        /* Todos os botões Select Order */
        const orderButtons =
                document.querySelectorAll(".select-order-btn");

        /* Selecionar uma order */
        orderButtons.forEach(function (button) {
            button.addEventListener("click", function () {

                /* Retirar seleção dos outros botões */
                orderButtons.forEach(function (otherButton) {
                    otherButton.classList.remove("btn-secondary");
                    otherButton.classList.add("btn-outline");
                    otherButton.textContent = "Select Order";
                });

                /* Guardar ID da order */
                selectedOrder =
                        button.getAttribute("data-order");

                /* Destacar a order selecionada */
                button.classList.remove("btn-outline");
                button.classList.add("btn-secondary");
                button.textContent = "Selected";

                /* Limpar erro */
                document.getElementById("selectionError")
                        .textContent = "";
            });
        });

        /* Aceitar a order selecionada */
        document.getElementById("acceptSelection")
                .addEventListener("click", function () {

                    if (selectedOrder === null) {
                        document.getElementById("selectionError")
                                .textContent =
                                "Please select an order first.";

                        return;
                    }

                    /* Abrir Active Route com o ID da order */
                    window.location.href =
                            "courier-active-route.html?order="
                            + selectedOrder;
                });
    </script>
<!-- vehicles.js gives the top bar the courier's document alerts -->
<script src="js/vehicles.js"></script>
<!-- Top bar (notifications + user menu), built by js/topbar.js -->
<script src="js/topbar.js"
        data-name="Diogo Silva"
        data-role="Courier"
        data-username="diogo.silva"
        data-profile="courier_profile.html"></script>
</body>
</html>
