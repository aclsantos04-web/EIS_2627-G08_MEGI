
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CMS - Register</title>

   
<link rel="stylesheet" href="css/cms-lara.css">
<link rel="stylesheet" href="css/public-header.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet">
</head>

<body>

    <!-- HEADER -->

    
<header class="public-header">

    <a href="cms-home.html" class="public-logo"
       aria-label="CMS - Homepage">
        <svg viewBox="0 0 64 40" aria-hidden="true">
            <rect x="2" y="4" width="34" height="24"
                  fill="currentColor"/>
            <path d="M38 12h12l10 10v6H38z"
                  fill="currentColor"/>
            <circle cx="14" cy="32" r="5"
                    fill="#fff" stroke="currentColor"
                    stroke-width="3"/>
            <circle cx="48" cy="32" r="5"
                    fill="#fff" stroke="currentColor"
                    stroke-width="3"/>
        </svg>
        CMS
    </a>

    <nav class="public-nav" aria-label="Main menu">
        <a href="cms-home.html">Home</a>
        <a href="team.html">Meet the Team</a>
    </nav>

    <div class="public-actions">
        <a href="login.html"
           class="public-btn public-btn-primary">
            Login
        </a>

        <a href="register.html"
           class="public-btn public-btn-outline">
            Get Started
        </a>
    </div>

</header>


    <!-- REGISTER PAGE -->

    <main class="register-page">

        <section class="register-container">

            <h1>Welcome in!</h1>

            <form id="register-form" novalidate>

                <div class="register-fields">
                    
                    
<!-- FULL NAME -->

<div class="form-group">
    <label for="reg-name">Full Name</label>
    <input type="text"
           id="reg-name"
           name="fullName"
           placeholder="Enter your full name"
           autocomplete="name"
           minlength="2"
           required>
</div>

<!-- PHONE NUMBER -->

<div class="form-group">
    <label for="reg-phone">Phone Number</label>
    <input type="tel"
           id="reg-phone"
           name="phone"
           placeholder="e.g. 912345678"
           inputmode="numeric"
           autocomplete="tel"
           maxlength="9"
           pattern="[0-9]{9}"
           required>
</div>


                    <!-- USERNAME -->

                    <div class="form-group">
                        <label for="reg-username">Username</label>

                        <input type="text"
                               id="reg-username"
                               name="username"
                               placeholder="Choose a username"
                               required>
                        <small id="reg-username-error" class="field-error"></small>
                    </div>

                    <!-- EMAIL -->

                    <div class="form-group">
                        <label for="reg-email">E-Mail</label>

                        <input type="email"
                               id="reg-email"
                               name="email"
                               placeholder="name@example.com"
                               required>
                    </div>

                    <!-- NIF -->

                    <div class="form-group">
                        <label for="reg-nif">NIF</label>

                        <input type="text"
                               id="reg-nif"
                               name="nif"
                               placeholder="e.g.: 222222222"
                               maxlength="9"
                               inputmode="numeric"
                               required>
                    </div>

                    <!-- ROLE -->

                    <div class="form-group">
                        <label for="reg-role">Role Choice</label>

                        <select id="reg-role" name="role" required>
                            <option value="">Select a type</option>
                            <option value="client">Client</option>
                            <option value="courier">Courier</option>
                            <option value="staff">Staff</option>
                        </select>
                    </div>

                    <!-- PASSWORD -->

                    <div class="form-group">
                        <label for="reg-password">Password</label>

                        <input type="password"
                               id="reg-password"
                               name="password"
                               placeholder="Enter your password"
                               autocomplete="new-password"
                               required>
                    </div>

                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">
                        <label for="reg-confirm">Confirm Password</label>

                        <input type="password"
                               id="reg-confirm"
                               name="confirm-password"
                               placeholder="Confirm your password"
                               autocomplete="new-password"
                               required>
                    </div>

                </div>
                <div id="register-message" role="status" aria-live="polite"></div>

                <!-- CREATE ACCOUNT BUTTON -->

                <button type="submit" class="register-button">
                    Create Account
                </button>

            </form>

        </section>

    </main>
    <script src="js/register.js"></script>
</body>
</html>
